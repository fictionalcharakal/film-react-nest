services:
  postgres:
    image: postgres:16-alpine
    container_name: afisha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - afisha-network
    ports:
      - "127.0.0.1:5433:5432"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: afisha-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    ports:
      - "8080:80"
    networks:
      - afisha-network
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/fictionalcharakal/film-react-nest-backend:latest
    container_name: afisha-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
    networks:
      - afisha-network
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/afisha
        VITE_CDN_URL: /content/afisha
    image: ghcr.io/fictionalcharakal/film-react-nest-frontend:latest
    container_name: afisha-frontend-build
    volumes:
      - frontend-dist:/usr/share/nginx/html

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ghcr.io/fictionalcharakal/film-react-nest-nginx:latest
    container_name: afisha-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
    networks:
      - afisha-network
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_completed_successfully

networks:
  afisha-network:
    driver: bridge

volumes:
  postgres-data:
  pgadmin-data:
  frontend-dist: